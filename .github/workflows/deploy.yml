name: Deploy for registry

on: workflow_dispatch

jobs: 
  deploy:
    runs-on: ubuntu-latest

    steps: 
    - uses: actions/checkout@v4
    
    - name: Deploy
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}:${{ vars.DEV_VERSION }}
